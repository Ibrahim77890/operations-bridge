name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck shfmt socat
      - name: Syntax
        run: |
          bash -n agent.sh bridge.sh install.sh uninstall.sh scripts/doctor.sh
          find lib commands tests -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Static analysis
        run: |
          shellcheck agent.sh bridge.sh install.sh uninstall.sh scripts/doctor.sh lib/*.sh commands/*.sh tests/*.sh
          shfmt -d agent.sh bridge.sh install.sh uninstall.sh scripts/doctor.sh lib/*.sh commands/*.sh tests/*.sh
      - name: Tests
        run: |
          chmod +x agent.sh bridge.sh
          for test_file in tests/test_*.sh; do
            bash "$test_file"
          done
